<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>

    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .product-detail__add {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .product-detail__add button {
        margin: 0;
      }

      .wishlist-link {
        display: block;
        margin-top: 1rem;
        text-align: center;
      }
    </style>

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <h3 id="productName"></h3>

        <h2 class="divider" id="productNameWithoutBrand"></h2>

        <img class="divider" src="" alt="" id="productImage" />

        <p class="product-card__price" id="productPrice"></p>

        <p class="product__color" id="productColor">Colors:</p>
        <ul id="colorSwatchList"></ul>

        <p class="product__description" id="productDescription"></p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="989CG">Add to Cart</button>
          <button id="addToWishlist">Add to Wishlist</button>
        </div>

        <a class="wishlist-link" href="../wishlist/index.html">View Wishlist</a>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
