<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>
  
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <h3 id="productName"></h3>

        <h2 class="divider" id="productNameWithoutBrand"></h2>

        <img class="divider" src="" alt="" id="productImage" />

        <p class="product-card__price" id="productPrice"></p>

        <p class="product__color" id="productColor">Colors: <ul id="colorSwatchList"></ul></p>

        <p class="product__description" id="productDescription"></p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="989CG">Add to Cart</button>
        </div>
      </section>
      <section class="product-comments">
        <h2>Comments:</h2>
        <form>
          <label for="commentName">Name:</label>
          <input type="text" id="commentName" name="commentName"></input>
          <label for="addComment">Add Comment:</label>
          <textarea id="addComment" name="addComment" placeholder="Say something about this product..." required></textarea>
          <input type="submit" id="submitComment"/>
        </form>
        <div class="allComments">

        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
