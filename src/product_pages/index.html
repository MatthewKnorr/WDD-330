<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>

    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .product-detail__add {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .product-detail__add button {
        margin: 0;
      }

      .wishlist-link {
        display: block;
        margin-top: 1rem;
        text-align: center;
      }
    </style>

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider">
      <section class="product-detail">
        <h3 id="productName"></h3>

        <h2 class="divider" id="productNameWithoutBrand"></h2>

        <div class="product-image-carousel divider">
          <img class="divider" src="" alt="" id="productImage" />

          <div id="imageThumbnailList" class="image-thumbnails"></div>
        </div>

        <p class="product-card__price" id="productPrice"></p>

        <p class="product__color" id="productColor">Colors:</p>
        <ul id="colorSwatchList"></ul>
        <div class="product__color">
          <p>Colors:</p>
          <ul id="colorSwatchList"></ul>
        </div>

        <p class="product__description" id="productDescription"></p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="989CG">Add to Cart</button>
          <button id="addToWishlist">Add to Wishlist</button>
        </div>

        <a class="wishlist-link" href="../wishlist/index.html">View Wishlist</a>
      </section>
      <section class="product-comments">
        <h2>Comments:</h2>
        <form>
          <label for="commentName">Name:</label>
          <input type="text" id="commentName" name="commentName"></input>
          <label for="addComment">Add Comment:</label>
          <textarea id="addComment" name="addComment" placeholder="Say something about this product..." required></textarea>
          <input type="submit" id="submitComment"/>
        </form>
        <div class="allComments">

        </div>
      </section>

      <section class="recommended-products">
        <h3>Other Gear to Consider</h3>
        <div id="recommendedProducts" class="recommended-products__grid"></div>
      </section>


    </main>

    <footer></footer>
  </body>
</html>
