<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/checkout.js"></script>
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <form id="checkoutForm" class ="formPanel">
          <fieldset class ="group">
            <legend>Shipping</legend>

              <label>
                First name
                <input id="fname" name="fname" type="text" required>
              </label>

              <label>
                Last Name
                <input id="lname" name="lname" type="text" required>
              </label>

              <label>
                Street
                <input id="street" name="street" type="text" required>
              </label>

              <label>
                City
                <input id="city" name="city" type="text" required>
              </label>

              <label>
                State
                <input id="state" name="state" type="text" required>
              </label>

              <label>
                Zip
                <input id="zip" name="zip" type="number" required>
              </label>

          </fieldset>

          <fieldset class = "payment">
            <legend>Payment</legend>

              <label>
                Card number
                <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric" required>
              </label>

              <label>
                Expiration
                <input id="expiration" name="expiration" type="text" required>
              </label>

              <label>
                Security Code
                <input id="code" name="code" type="text" inputmode="numeric" maxlength="3" required>
              </label>

          </fieldset>

          
<fieldset class="orderSummary">
  <legend>Order Summary</legend>

  <aside class="panel checkout-summary">
    <p class="totalSubHeader">
      Item Subtotal <span id="num-items">0</span>
      <span id="cartTotal">$0.00</span>
    </p>

    <p>
      Shipping Estimate
      <span id="shipping">$0.00</span>
    </p>

    <p>
      Tax
      <span id="tax">$0.00</span>
    </p>

    <h2>
      Order Total
      <span id="orderTotal">$0.00</span>
    </h2>
  </aside>
</fieldset>

<button class="checkoutSubmit" type="submit">
  Checkout
</button>

        </form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
